# Pull request: build and test. Push to main: build, test and publish the jar to the
# feedback-report Lambda via OIDC (no static AWS keys).
name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FUNCTION_NAME: feedback-report
  AWS_REGION: sa-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests (mocks only, no AWS calls), ArchUnit and JaCoCo coverage check, then the shaded jar
      - name: Build and test
        run: ./mvnw -B verify

      - name: Keep the jar for the deploy job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: lambda-jar
          path: target/feedback-lambda-report-*.jar
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this job can request the OIDC token
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lambda-jar

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The role only allows lambda:UpdateFunctionCode on this function
      - name: Update function code
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$(ls feedback-lambda-report-*.jar)" \
            --query '{version: Version, lastUpdateStatus: LastUpdateStatus, codeSize: CodeSize}' \
            --output table
